server:
  port: 8080

spring:
  application:
    name: animal-monitoring-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:animal_monitoring}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  # Increase max upload size for image/frame uploads
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  sql:
    init:
      mode: never

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:VGhpcyBpcyBhIHZlcnkgbG9uZyBhbmQgc2VjdXJlIHNlY3JldCBrZXkgZm9yIEpXVCB0b2tlbiBnZW5lcmF0aW9uIGluIGFuaW1hbCBtb25pdG9yaW5n}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# AI / Detection Configuration
ai:
  model:
    # Place your YOLO ONNX model at this path relative to the working directory.
    # Example: backend/models/yolov8n.onnx
    # If the file is absent, the AI service starts in STUB mode and returns no detections.
   path: ${AI_MODEL_PATH:models/yolo11n.onnx}

  confidence:
    # Minimum detection confidence (0.0–1.0). Detections below this are discarded.
    threshold: ${AI_CONFIDENCE_THRESHOLD:0.5}

  nms:
    # Non-Maximum Suppression IoU threshold. Overlapping boxes above this are suppressed.
    threshold: ${AI_NMS_THRESHOLD:0.45}

  input:
    # YOLO model input resolution. Must match the resolution used during ONNX export.
    width: ${AI_INPUT_WIDTH:640}
    height: ${AI_INPUT_HEIGHT:640}

  image:
    # Directory where detection evidence images are stored.
    storage-path: ${AI_IMAGE_STORAGE_PATH:uploads/detections}

  # Mapping from YOLO class index (0-based) to animal name.
  # Adjust class IDs to match your specific trained model.
